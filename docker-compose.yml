version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: insightx_postgres
    restart: always
    environment:
      POSTGRES_DB: insightx_db
      POSTGRES_USER: insightx_user
      POSTGRES_PASSWORD: insightx_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightx_user -d insightx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: insightx_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@insightx.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
